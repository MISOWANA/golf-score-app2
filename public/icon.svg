<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bb-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2440"/>
      <stop offset="1" stop-color="#0b0e18"/>
    </linearGradient>
    <linearGradient id="bb-flag" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0c93a"/>
      <stop offset="1" stop-color="#c9a228"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bb-bg)"/>

  <!-- 아트는 256,256을 중심으로 한 320x320 박스 안에 들어간다.
       마스커블 변형(icon-maskable.svg)에서 같은 아트를 축소만 하면 되도록. -->
  <g>
    <!-- 그린 -->
    <ellipse cx="256" cy="374" rx="132" ry="34" fill="#16301f"/>
    <ellipse cx="256" cy="374" rx="132" ry="34" fill="none" stroke="#2ea868" stroke-width="7"/>
    <!-- 홀 -->
    <ellipse cx="286" cy="366" rx="19" ry="8" fill="#05080f"/>
    <!-- 깃대 -->
    <rect x="279" y="118" width="14" height="250" rx="7" fill="#c9a228"/>
    <!-- 깃발 -->
    <path d="M286 122 L406 164 L286 206 Z" fill="url(#bb-flag)"/>
    <!-- 볼 -->
    <circle cx="178" cy="352" r="30" fill="#e8edf8"/>
    <circle cx="169" cy="344" r="4" fill="#b9c4d6"/>
    <circle cx="183" cy="341" r="4" fill="#b9c4d6"/>
    <circle cx="190" cy="354" r="4" fill="#b9c4d6"/>
    <circle cx="175" cy="359" r="4" fill="#b9c4d6"/>
  </g>
</svg>
