name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# 만들기(build)와 배포(deploy)를 두 작업으로 나눈다 (GitHub 공식 예시와 같은 모양).
# 한 작업 안에서 올리자마자 배포하면, 올린 파일을 GitHub 가 아직 못 찾아
# "No artifacts named github-pages were found" 로 배포가 실패하는 일이 있었다 (2026-11-25 두 번 연속).
# 작업을 나누면 다음 작업이 시작될 때는 파일이 다 준비돼 있다.
jobs:
  build:
    runs-on: ubuntu-latest
    # 예전처럼 github-pages 환경 안에서 만든다 — 지도 인증키(VITE_VWORLD_KEY)를 이 환경에 등록해 둔 경우에도 그대로 읽히게
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 엔진·DB·화면 테스트. 실패하면 배포하지 않는다.
      - run: npm test

      # VWorld 지도 인증키. 저장소 Settings → Secrets and variables → Actions 에
      # VITE_VWORLD_KEY 를 등록해 두면 빌드에 주입돼, 사용자는 키를 입력하지
      # 않고 바로 지도를 쓸 수 있다. 비워두면 지도 화면에서만 키 입력을 요청한다.
      - run: npm run build
        env:
          VITE_VWORLD_KEY: ${{ secrets.VITE_VWORLD_KEY }}

      - uses: actions/configure-pages@v4
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
