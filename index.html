    <!-- 홈 화면에서 주소창 없이 실행. iOS 16.4 미만은 manifest의 display를 읽지 못해
         apple- 접두사 메타가 여전히 필요하다. 상태바는 black(불투명) — 앱이 상단
         safe-area inset을 처리하지 않아 black-translucent면 헤더가 가려진다. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Birdie" />
